<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foroud Paknia | Official Website</title>

<meta name="description" content="Official website of filmmaker, screenwriter and researcher Foroud Paknia.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
background:#050505;
color:#fff;
font-family:Inter,sans-serif;
overflow-x:hidden;
}

a{
color:inherit;
text-decoration:none;
}

header{

position:fixed;
top:0;
left:0;
width:100%;
padding:28px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.45);
backdrop-filter:blur(14px);
z-index:999;

}

.logo{

font-family:"Cormorant Garamond",serif;
font-size:32px;
letter-spacing:4px;

}

nav{

display:flex;
gap:35px;

}

nav a{

font-size:13px;
letter-spacing:2px;
opacity:.85;
transition:.3s;

}

nav a:hover{

opacity:1;
color:#d4af37;

}

.hero{

min-height:100vh;

background:

linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.88)),
url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba")
center center/cover no-repeat;

display:flex;
align-items:center;
justify-content:center;
padding:120px 8%;

}

.hero-content{

display:grid;
grid-template-columns:350px 1fr;
gap:90px;
align-items:center;
max-width:1300px;

}

.hero img{

width:340px;
height:340px;
border-radius:50%;
object-fit:cover;
border:4px solid rgba(212,175,55,.4);
box-shadow:0 0 60px rgba(212,175,55,.15);

}

.hero h1{

font-family:"Cormorant Garamond",serif;
font-size:82px;
font-weight:600;
letter-spacing:8px;
margin-bottom:15px;

}

.hero h2{

font-size:21px;
font-weight:300;
letter-spacing:4px;
color:#d4af37;
margin-bottom:30px;

}

.hero p{

font-size:19px;
line-height:2;
max-width:720px;
color:#ddd;
margin-bottom:45px;

}

.buttons{

display:flex;
gap:20px;
flex-wrap:wrap;

}

.btn{

padding:16px 38px;
border:1px solid #d4af37;
transition:.35s;
letter-spacing:2px;
font-size:13px;

}

.btn:hover{

background:#d4af37;
color:#111;

}

.btn.dark{

border-color:#555;

}

section{

padding:120px 8%;
max-width:1400px;
margin:auto;

}

.section-title{

font-family:"Cormorant Garamond",serif;
font-size:58px;
margin-bottom:25px;
letter-spacing:4px;

}

.section-text{

max-width:900px;
font-size:20px;
line-height:2;
color:#cfcfcf;

}

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:35px;
margin-top:70px;

}

.card{

padding:40px;
border:1px solid #2b2b2b;
background:#101010;
transition:.4s;

}

.card:hover{

transform:translateY(-8px);
border-color:#d4af37;

}

.card h3{

font-family:"Cormorant Garamond",serif;
font-size:34px;
margin-bottom:18px;

}

.card p{

line-height:1.9;
color:#bbb;

}

@media(max-width:950px){

.hero-content{

grid-template-columns:1fr;
text-align:center;

}

.hero img{

margin:auto;

}

.hero h1{

font-size:54px;

}

nav{

display:none;

}

.buttons{

justify-content:center;

}

}

</style>

</head>

<body>

<header>

<div class="logo">
FOROUD PAKNIA
</div>

<nav>

<a href="#about">ABOUT</a>

<a href="#films">FILMS</a>

<a href="#documentaries">DOCUMENTARIES</a>

<a href="#research">RESEARCH</a>

<a href="#contact">CONTACT</a>

</nav>

</header>

<section class="hero">

<div class="hero-content">

<img src="foroud-paknia.jpg.jpg" alt="Foroud Paknia">

<div>

<h1>FOROUD PAKNIA</h1>

<h2>
FILMMAKER • SCREENWRITER • RESEARCHER
</h2>

<p>

Exploring cinema, cultural memory and human experience through feature films, documentary storytelling and interdisciplinary research.

</p>

<div class="buttons">

<a class="btn" href="#films">
FEATURE FILMS
</a>

<a class="btn dark" href="#documentaries">
DOCUMENTARIES
</a>

</div>

</div>

</div>

</section>
